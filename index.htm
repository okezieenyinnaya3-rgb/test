<!DOCTYPE html>
    <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Application Form</title>
        </head>

        <body>

            <h1>Application Form</h1>

            <form action="" method="post">

            <table>

                <tr>
                    <td>
                        <label for="firstname">First Name:</label>
                    </td>

                    <td>
                        <input type="text" id="firstname" name="firstname">
                    </td>

                    <td>
                        <label for="lastname">Last Name:</label>
                    </td>

                    <td>
                        <input type="text" id="lastname" name="lastname">
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="dob">Date of birth:</label>
                    </td>

                    <td> 
                        <input type="date" id="dob" name="dob">
                    </td>

                    <td>
                        <label for="age">Age:</label>
                    </td>

                    <td>
                        <input type="number" id="age" name="age" min="1" max="100"> 
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="gender">Gender:</label>
                    </td>

                    <td>
                        <select id="gender" name="gender">

                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>

                        </select>
                    </td>

                    <td>
                        <label for="email">Email Address:</label>
                    </td>

                    <td>
                        <input type="email" id="email" name="email">
                    </td>
                </tr>

            </table>


            <br>


            <fieldset>

                <h2>Position Available</h2>

                <input type="radio" id="junior" name="position" value="junior">

                <label for="junior">
                    Junior Developer
                </label>


           

                <input type="radio" id="midlevel" name="position" value="midlevel" >

                <label for="midlevel">
                    Mid-level Developer
                </label>


           


                <input type="radio" id="senior" name="position" value="senior"> 

                <label for="senior">
                    Senior Developer
                </label>

            </fieldset>


            <br>


             <fieldset>
                <legend>Bio data</legend>
                <h2>Programming Languages</h2>

                <input type="checkbox" id="java" name="language" value="java">

                <label for="java">
                    CSS
                </label>


           


                <input type="checkbox" id="javascript" name="language" value="javascript">

                <label for="javascript">
                    JavaScript
                </label>


            


                <input type="checkbox" id="python" name="language" value="python">

                <label for="python">
                    Python
                </label>
          
                <input type="checkbox" id="HTML5" name="language" value="HTML5">

                <label for="HTML5">
                    HTML5
                </label>
            </fieldset>


            <br>


            <table>

                <tr>

                    <td>
                        <label for="password">
                            Password:
                        </label> 
                    </td>

                    <td>
                        <input type="password" id="password" name="password" size="25">
                    </td>


                    <td>
                        <label for="confirm-password">
                            Confirm Password:
                        </label>
                    </td>

                    <td>
                        <input type="password" id="confirm-password" name="confirm-password" size="25">
                    </td>

                </tr>

            </table>


            <br>


            <input type="submit" value="Submit">

       

            <input type="reset" value="Reset">

        </form>

    </body>

</html>
